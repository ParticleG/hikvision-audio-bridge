[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hikvision-audio-bridge"
version = "0.3.0"
description = "Central Hikvision camera audio server and independent PipeWire desktops"
requires-python = ">=3.13"
dependencies = [
  "aiohttp>=3.12,<4",
  "audioop-lts>=0.2.2",
  "cryptography>=43",
  "edge-tts>=7.2,<8",
  "h11>=0.16,<1",
  "httpx>=0.28.1,<1",
  "secretstorage>=3.3.3,<4",
]

[project.scripts]
hikvision-audio = "hikvision_audio_bridge.cli:main"
hikvision-audio-server = "hikvision_audio_bridge.cli:server_main"

[dependency-groups]
dev = ["ruff>=0.12", "ty>=0.0.1"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.hatch.build.targets.wheel]
packages = ["src/hikvision_audio_bridge"]
